<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu código NODIA</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0f172a, #1f3a5f 60%, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f5f7fa; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
      padding: 36px 28px; text-align: center; backdrop-filter: blur(6px);
    }
    .descuento {
      font-size: 3rem; font-weight: 800; color: #ffd166; margin: 0 0 4px;
    }
    .programa { font-size: 0.95rem; opacity: 0.85; margin: 0 0 28px; }
    .codigo-label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; margin-bottom: 8px; }
    .codigo {
      font-size: 2.4rem; font-weight: 700; letter-spacing: 0.12em;
      background: rgba(255,255,255,0.1); border: 1px dashed rgba(255,255,255,0.4);
      border-radius: 14px; padding: 18px 12px; margin: 0 0 20px; word-break: break-all;
    }
    .nota { font-size: 0.85rem; opacity: 0.75; line-height: 1.4; }
    .repetido-badge {
      display: inline-block; font-size: 0.75rem; background: rgba(255,209,102,0.15);
      color: #ffd166; border: 1px solid rgba(255,209,102,0.4); border-radius: 999px;
      padding: 4px 12px; margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    {% if repetido %}
      <div class="repetido-badge">Ya tenías un código — aquí está de nuevo</div>
    {% endif %}
    <p class="descuento">-{{ descuento }}</p>
    <p class="programa">{{ programa }}</p>
    <p class="codigo-label">Tu código</p>
    <div class="codigo">{{ codigo }}</div>
    <p class="nota">Guarda este código y muéstralo para aplicar tu descuento.
      Es único — nadie más recibió este mismo código.</p>
  </div>
</body>
</html>
