<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NODIA — Códigos generados</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; color: #1f2937; }
    h1 { font-size: 1.2rem; }
    table { border-collapse: collapse; width: 100%; max-width: 560px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
    th { background: #1f3a5f; color: white; }
    tr:nth-child(even) { background: #f8fafc; }
  </style>
</head>
<body>
  <h1>Códigos generados: {{ total }}</h1>
  <table>
    <tr><th>Código</th><th>Generado</th><th>Redimido</th></tr>
    {% for c in codigos %}
    <tr>
      <td>{{ c["codigo"] }}</td>
      <td>{{ c["generado_en"] }}</td>
      <td>{{ "Sí" if c["redimido"] else "No" }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
